<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8FAFC">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1220">
<title>Offline · R Ally's Tech</title>
<!--
  Served by public/sw.js when a navigation can't reach the network. Entirely
  self-contained — inline styles, an inline SVG mark, no fonts, no requests —
  because by definition nothing else can load. Both languages are on the page;
  the one matching the URL the visitor asked for (/fil/… → Filipino) leads.
  Colours are the site's paper/surface/ink tokens; the theme follows the stored
  preference (localStorage "mykt-theme"), then the OS.
-->
<script>
(function () {
  var d = document.documentElement;
  try {
    var s = localStorage.getItem("mykt-theme");
    var dark = s === "dark" || (s !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    d.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (e) { d.setAttribute("data-theme", "light"); }
  if (/^\/fil(\/|$)/.test(location.pathname)) { d.setAttribute("lang", "fil"); d.setAttribute("data-lead", "fil"); }
})();
</script>
<style>
  :root {
    --paper: #F8FAFC; --surface: #FFFFFF; --mist: #CBD5E1; --slatey: #94A3B8; --ink: #1E293B;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --paper: #0B1220; --surface: #131D30; --mist: #2A3647; --slatey: #8496B0; --ink: #E6EDF7;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center; padding: 24px 16px;
    background: var(--paper); color: var(--ink);
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%; max-width: 520px; padding: 40px 32px;
    background: var(--surface); border: 1px solid var(--mist); border-radius: 24px;
    box-shadow: 0 30px 80px -50px rgba(15, 23, 42, 0.45);
  }
  .mark { display: block; width: 62px; height: 52px; margin-bottom: 28px; }
  .eyebrow {
    margin: 0 0 10px; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.08em; color: color-mix(in srgb, var(--ink) 70%, var(--surface));
  }
  h1 { margin: 0; font-size: clamp(28px, 7vw, 38px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 700; }
  p { margin: 12px 0 0; color: color-mix(in srgb, var(--ink) 78%, var(--surface)); }
  .alt { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--mist); }
  .alt h2 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
  .alt p { margin-top: 6px; font-size: 14px; }
  [data-lead="fil"] .stack { display: flex; flex-direction: column-reverse; }
  [data-lead="fil"] .alt { margin-top: 0; padding-top: 0; border-top: 0; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--mist); }
  button {
    margin-top: 32px; padding: 12px 22px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--ink); color: var(--paper); font: inherit; font-size: 15px; font-weight: 600;
    transition: transform 300ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 300ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 10px 30px -12px rgba(184, 92, 122, 0.6); }
  button:focus-visible { outline: 2px solid #E0A23A; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } button:hover { transform: none; } }
</style>
</head>

  <div class="stack">
    <section lang="en">
      <h1>You're offline.</h1>
      <p>This page needs a connection. Check your Wi-Fi or mobile data, then try again — we'll pick up right where you left off.</p>
    </section>
    <section class="alt" lang="fil">
      <h2>Wala kang koneksyon.</h2>
      <p>Kailangan ng internet ang pahinang ito. Tingnan ang iyong Wi-Fi o mobile data, saka subukang muli.</p>

</main>
<script>
  document.getElementById("retry").addEventListener("click", function () { location.reload(); });
  // back online → load the page that was asked for
  window.addEventListener("online", function () { location.reload(); });
</script>
